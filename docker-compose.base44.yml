services:
  web:
    image: node:22-alpine
    working_dir: /app
    restart: on-failure
    ports:
      - "3000:5173"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    command: ["sh", "-ec", "npm ci --no-audit --no-fund && exec npm run dev"]
    labels:
      base44.project: Daylight
      base44.kind: web
      base44.port: "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 3
volumes:
  node_modules:
